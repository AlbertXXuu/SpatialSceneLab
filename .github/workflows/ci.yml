name: Scene package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numeric dependency
        run: python -m pip install -r requirements.txt
      - name: Check units, frames, identity, source hash and edits
        run: python -B -m unittest discover -s tests -v
      - name: Compile optional native Blender entry points
        run: python -m py_compile blender_edit.py blender_scene.py verify_blender_edit.py blender_edit_controls.py
      - name: Read back published controlled exports
        run: |
          python -B scene_lab.py verify fixtures/three-objects.json examples/three-objects-before.glb
          python -B scene_lab.py verify examples/three-objects-edited.json examples/three-objects-after.glb

  cpu-rgbd-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU RGB-D dependencies
        run: python -m pip install -r requirements-local.txt
      - name: Verify raw-input drift, mesh write failures and surface boundaries
        run: python -B -m unittest discover -s tests -v
      - name: Reconstruct original fixture under Python outbound network guard
        run: |
          python fixtures/make_rgbd_fixture.py --output .local/input --resolution-scale 4
          python offline_run.py --script scan_pipeline.py --report .local/points-guard.json -- reconstruct --input .local/input --output .local/points
          python offline_run.py --script reconstruct_mesh.py --report .local/surface-guard.json -- --scene .local/points/scene.json --output .local/surface
      - name: Check complex-scene fixed-mesh controls and sensitivity replay
        run: |
          python fixtures/make_complex_fixture.py --output .local/s0-input --width 80 --height 60 --scene dev-same-color-dining
          python offline_run.py --script run_development.py --report .local/s0-guard.json -- --suite .local/s0-input --output .local/s0-results
          python reevaluate_development.py --suite .local/s0-input --results .local/s0-results --output .local/s0-sensitivity
      - name: Diagnose and export the measured B1 partition
        run: |
          python partition_diagnostics.py --suite .local/s0-input --results .local/s0-results --published-results .local/s0-results/development-results.json --output .local/s2a-diagnostics
          python export_partition.py --results .local/s0-results --published-results .local/s0-results/development-results.json --output .local/b1-bundles
