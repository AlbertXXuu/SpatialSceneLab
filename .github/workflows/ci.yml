name: Scene package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numeric dependency
        run: python -m pip install -r requirements.txt
      - name: Check units, frames, identity, source hash and edits
        run: python -B -m unittest discover -s tests -v
      - name: Read back published controlled exports
        run: |
          python -B scene_lab.py verify fixtures/three-objects.json examples/three-objects-before.glb
          python -B scene_lab.py verify examples/three-objects-edited.json examples/three-objects-after.glb
